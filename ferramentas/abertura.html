<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Páginas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{--bg:#f6f1e7;--ink:#2a2420;--mut:#8a7c6c;--a1:#e08a5c;--a2:#a0401e;--a3:#e0b04a;--trilho:rgba(160,64,30,.12);--card:#fffdf8}
@media(prefers-color-scheme:dark){:root{--bg:#14110e;--ink:#f0e8db;--mut:#a39886;--trilho:rgba(240,232,219,.12);--card:#25211d}}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;position:relative;transition:opacity .55s ease,transform .55s ease;user-select:none;cursor:default}
body.saindo{opacity:0;transform:scale(1.03)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;animation:flut 16s ease-in-out infinite}
.orb.a{width:460px;height:460px;background:var(--a1);top:-160px;right:6%}
.orb.b{width:380px;height:380px;background:var(--a3);bottom:-160px;left:8%;animation-delay:-6s;animation-duration:20s;opacity:.32}
.orb.c{width:300px;height:300px;background:#c47bd6;top:40%;left:-120px;animation-delay:-11s;animation-duration:24s;opacity:.18}
@keyframes flut{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
#letras{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#letras i{position:absolute;bottom:-60px;font:italic 700 22px Georgia,serif;color:var(--a2);opacity:0;animation:voa linear infinite}
@keyframes voa{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.22}85%{opacity:.14}100%{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
.centro{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}}
.logo{position:relative;width:140px;height:140px;display:grid;place-items:center;margin-bottom:30px}
.anel{position:absolute;inset:0;border-radius:38px;background:conic-gradient(from 0deg,var(--a3),var(--a1),var(--a2),#c47bd6,var(--a3));animation:gira 3.4s linear infinite}
.anel::after{content:"";position:absolute;inset:3px;border-radius:35px;background:var(--bg)}
.pulso{position:absolute;inset:-8px;border-radius:46px;border:2px solid var(--a1);opacity:0;animation:pulso 2.4s ease-out infinite}
.pulso.b{animation-delay:1.2s}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulso{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.nucleo{position:relative;width:110px;height:110px;border-radius:32px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 18px 50px -12px rgba(160,64,30,.65);animation:flutua 3s ease-in-out infinite;perspective:300px}
@keyframes flutua{50%{transform:translateY(-6px)}}
.livro{position:relative;width:66px;height:46px}
.livro .pg{position:absolute;top:0;width:33px;height:46px;background:#fffcf6;border-radius:2px}
.livro .esq{left:0;transform:skewY(10deg);transform-origin:right;background:#fffcf6}
.livro .dir{right:0;transform:skewY(-10deg);transform-origin:left;background:#f6e8d4}
.livro .vira{right:0;width:33px;height:46px;position:absolute;top:0;background:#fffaf0;transform-origin:left center;border-radius:2px;animation:folheia 2.2s cubic-bezier(.45,.05,.55,.95) infinite;backface-visibility:visible}
@keyframes folheia{0%,15%{transform:rotateY(0) skewY(-10deg)}55%,100%{transform:rotateY(-180deg) skewY(-10deg);opacity:.9}}
.livro .ln{position:absolute;height:2px;background:rgba(180,83,42,.45);border-radius:2px}
h1{font:700 52px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a3),var(--a1),var(--a2));background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilho 5s linear infinite}
@keyframes brilho{to{background-position:250% 0}}
.sub{color:var(--mut);margin-top:8px;font-size:15px;letter-spacing:.4px}
.prog{width:min(420px,78vw);margin-top:38px}
.trilho{height:6px;border-radius:99px;background:var(--trilho);overflow:hidden;position:relative}
.trilho i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1),var(--a2));box-shadow:0 0 16px rgba(224,138,92,.6);position:relative}
.trilho i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:varre 1.4s ease-in-out infinite}
@keyframes varre{to{transform:translateX(100%)}}
.info{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--mut);min-height:20px}
#msg{transition:opacity .25s,transform .25s}
#msg.troca{opacity:0;transform:translateY(5px)}
#pct{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.pontos{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.pontos i{width:5px;height:5px;border-radius:50%;background:var(--a1);animation:ponto 1.1s infinite}
.pontos i:nth-child(2){animation-delay:.18s}.pontos i:nth-child(3){animation-delay:.36s}
@keyframes ponto{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.citacao{position:fixed;bottom:26px;left:0;right:0;text-align:center;font:italic 15px/1.5 Georgia,serif;color:var(--mut);z-index:2;padding:0 24px;animation:entra 1.2s .5s both}
.citacao small{display:block;font:12px "Segoe UI",sans-serif;font-style:normal;margin-top:4px;opacity:.8}
.erro{display:none;margin-top:26px;max-width:460px;padding:14px 18px;border:1px solid rgba(220,80,60,.5);background:rgba(220,80,60,.1);color:#c0392b;border-radius:14px;font-size:14px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div id="letras"></div>
<div class="centro">
  <div class="logo"><span class="pulso"></span><span class="pulso b"></span><span class="anel"></span>
    <div class="nucleo"><div class="livro"><span class="pg esq"></span><span class="pg dir"></span><span class="vira"></span></div></div></div>
  <h1>Páginas</h1><div class="sub">Hábito de leitura e biblioteca virtual</div>
  <div class="prog"><div class="trilho"><i id="bar"></i></div>
    <div class="info"><span><span id="msg">Abrindo a biblioteca</span><span class="pontos"><i></i><i></i><i></i></span></span><span id="pct">0%</span></div></div>
  <div class="erro" id="erro"></div>
</div>
<div class="citacao" id="cit"></div>
<script>
(function(){
var L='abcdefghijlmnopqrstuvçãéêóõ❝❞§¶&?!'.split(''),box=document.getElementById('letras');
for(var i=0;i<34;i++){var e=document.createElement('i');e.textContent=L[Math.floor(Math.random()*L.length)];e.style.left=(Math.random()*100)+'%';e.style.fontSize=(14+Math.random()*26)+'px';e.style.animationDuration=(9+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*18)+'s';e.style.setProperty('--r',(Math.random()*120-60)+'deg');box.appendChild(e);}
var C=[['Ler é sonhar pela mão de outrem.','Fernando Pessoa'],['Um país se faz com homens e livros.','Monteiro Lobato'],['Tudo vale a pena se a alma não é pequena.','Fernando Pessoa'],['Ousa saber!','Horácio'],['Mudam-se os tempos, mudam-se as vontades.','Luís de Camões'],['O essencial é invisível aos olhos.','Antoine de Saint-Exupéry'],['Enquanto adiamos, a vida passa.','Sêneca']];
var c=C[Math.floor(Math.random()*C.length)];document.getElementById('cit').innerHTML='“'+c[0]+'”<small>'+c[1]+'</small>';
var M=['Abrindo a biblioteca','Tirando o pó das estantes','Separando seus livros','Marcando a página onde você parou','Acendendo a luz de leitura','Quase lá'];
var bar=document.getElementById('bar'),pct=document.getElementById('pct'),msg=document.getElementById('msg'),erro=document.getElementById('erro');
var t0=performance.now(),mostrado=0,url=null,saindo=false,parou=false,ult='',mi=0;
function setMsg(t){if(!t||t===ult)return;ult=t;msg.classList.add('troca');setTimeout(function(){msg.textContent=t;msg.classList.remove('troca');},230);}
setInterval(function(){if(!url&&!parou&&mi<M.length-1){mi++;setMsg(M[mi]);}},1300);
function quadro(){
  if(parou)return;
  var t=(performance.now()-t0)/1000,teto=url?100:Math.min(92,100*(1-Math.exp(-t/2.2)));
  if(mostrado<teto)mostrado=Math.min(teto,mostrado+Math.max(.12,(teto-mostrado)*(url?.12:.05)));
  bar.style.width=mostrado+'%';pct.textContent=Math.floor(mostrado)+'%';
  if(url&&!saindo&&mostrado>=99.6&&performance.now()-t0>1600){saindo=true;document.body.classList.add('saindo');setTimeout(function(){location.replace(url);},520);}
  requestAnimationFrame(quadro);
}
window.pronto=function(u){url=u;setMsg('Pronto!');};
window.falha=function(t){parou=true;erro.style.display='block';erro.textContent=t;setMsg('Não foi possível abrir');};
quadro();
})();
</script></body></html>
